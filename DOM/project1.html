<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>projects</title>
    <style>
        #main{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        ul{
            display: flex;
            list-style-type: none;
            padding: 0;

        }
        li{
            width: 250px;
            height: 250px;
            margin: 5px;
            border: 10px solid black;
        }
        
    </style>
    
</head>
<body>

    <h1 align="center">click on any color</h1>
    <div id="main">
        <ul>
            <li id="grey" style="background-color: grey;"> </li>
            <li id="white" style="background-color: white;"> </li>
            <li id="blue" style="background-color: blue;"> </li>
            <li id="yellow" style="background-color: yellow;"> </li>
        </ul>
        
    </div>
    
</body>
<script>
    const grey = document.getElementById("grey");
    const white = document.getElementById("white"); 
    const blue = document.getElementById("blue");
    const yellow = document.getElementById("yellow");

     grey.addEventListener('click', function() {
        document.body.style.backgroundColor = "grey";
    });
    white.addEventListener('click', function() {
        document.body.style.backgroundColor = "white";
    });
    blue.addEventListener('click', function() {
        document.body.style.backgroundColor = "blue";
    });
    yellow.addEventListener('click', function() {
        document.body.style.backgroundColor = "yellow";
    });
</script>
</html>
