<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project2</title>
    <style> 
        body{
            background-color: #535050;
        }
        form{padding:20px}
    </style>
</head>
<body>
    <h1>BMI Calculator</h1>
    <form id="form">
        <label for="weight">Weight (kg):</label>
        <input type="number" id="weight" name="weight" required><br><br>
        

        <label for="height">Height (cm):</label>
        <input type="number" id="height" name="height" required><br><br>

        <button type="submit" id="calc">Calculate BMI</button>
    </form> 
</body>
<script>
    const form= document.querySelector("#form");
    
    form.addEventListener("submit",function(e){
        e.preventDefault();
        const weight= parseInt(document.querySelector("#weight").value);
        const height= parseInt(document.querySelector("#height").value);
        const bmi= document.querySelector("#calc")
        
        if(height===""|| height<0|| isNaN(height)){
            bmi.innerHTML="please enter valid height";
        }
        else if( weight===""||weight<0|| isNaN(weight)){
            bmi.innerHTML="please enter valid weight";
        }
        else{
            const bmiValue= (weight/(height*height))*10000;
            bmi.innerHTML= "Your BMI is: "+bmiValue.toFixed(2);
        }
    })
    
</script>
</html>
